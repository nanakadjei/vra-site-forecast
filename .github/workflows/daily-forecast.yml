name: Daily forecast build and deploy

on:
  schedule:
    - cron: "0 5 * * *"    # every day 05:00 UTC (Ghana is on GMT, so = 05:00 Ghana time)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub switches off scheduled workflows in a public repo after 60 days without repository
  # activity. Re-enabling the workflow through the API counts as activity and resets that timer.
  # This job is independent of the build, so it still runs if a build fails.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily-forecast.yml --repo "${{ github.repository }}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build static site (downloads data, fits models, writes forecasts)
        run: python build_static.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
